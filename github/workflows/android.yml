
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Prepare app files
        run: |
          mkdir www
          cp index.html manifest.webmanifest sw.js icon-192.svg icon-512.svg www/
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sonkkeut.code",
            "appName": "손끝 코드",
            "webDir": "www"
          }
          EOF

      - name: Create Android project
        run: npx cap add android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sonkkeut-code-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
