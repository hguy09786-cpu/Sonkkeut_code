<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11151b"><title>손끝 코드 — Chord Wheel</title>
<style>
:root{--cyan:#58d9ff;--white:#f5f7fa;--muted:#b9c3ce}
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:780px;margin:auto;min-height:100svh;padding:14px 14px 24px}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 14px}
.brand{font-size:12px;letter-spacing:.22em;color:var(--cyan);font-weight:800}.sub{font-size:11px;color:var(--muted);margin-top:4px}
.badge{border:1px solid #ffffff30;border-radius:20px;padding:7px 10px;font-size:11px;color:#dce5ee}
.stage{position:relative;width:100%;aspect-ratio:4/5;max-height:760px;overflow:hidden;border-radius:24px;background:linear-gradient(145deg,#34404b,#111923 65%,#1e2934);border:1px solid #ffffff20;isolation:isolate}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.82;display:none}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,#09111b35,#09111b10 45%,#09111b88);pointer-events:none}
.camera-hint{position:absolute;top:18px;left:18px;right:18px;text-align:center;font-size:12px;color:#e9f3fa;text-shadow:0 1px 8px #000}
.wheel-area{position:absolute;left:50%;top:48%;width:min(76vw,440px);height:min(76vw,440px);max-width:68%;max-height:58%;transform:translate(-50%,-50%)}
#wheel{width:100%;height:100%;overflow:visible;touch-action:manipulation}
.segment{fill:#15233055;stroke:#d7f3ff55;stroke-width:1.2;cursor:pointer;transition:fill .12s}
.segment.active{fill:#36cfff78;stroke:#8deaff;stroke-width:2}
.chord-label{font-size:17px;fill:#f5f8fb;text-anchor:middle;dominant-baseline:middle;pointer-events:none;font-weight:600}
.chord-label.active{fill:#fff;font-size:20px;font-weight:800}
.center{fill:#0c1721;stroke:#aeeeff99;stroke-width:1.5;cursor:pointer}
.center-text{fill:#eafaff;text-anchor:middle;dominant-baseline:middle;font-size:10px;letter-spacing:1px;pointer-events:none}
.song{position:absolute;bottom:22px;left:16px;right:16px;text-align:center;font-size:clamp(20px,5vw,30px);font-weight:800;color:#ffe15c;text-shadow:0 2px 12px #000}
.song small{display:block;font-size:10px;letter-spacing:.16em;color:#fff;margin-bottom:7px}
.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
button,select{border:1px solid #34414e;border-radius:14px;background:#19232e;color:#eef5fb;padding:12px 14px;font-size:13px}
button.primary{background:var(--cyan);color:#06131b;border:0;font-weight:800;flex:1}
button:disabled{opacity:.45}
.panel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.info{background:#151d27;border:1px solid #293542;border-radius:16px;padding:13px}
.kicker{font-size:10px;color:#91a4b5;letter-spacing:.12em}.value{font-size:23px;font-weight:800;margin-top:4px}.notes{font-size:12px;color:#aebbc8;margin-top:3px}
.options{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;color:#bac5d0;font-size:12px}
select{padding:9px 11px}
.help{font-size:12px;line-height:1.65;color:#9eacb9;margin:13px 4px 0}
@media(min-width:600px){.app{padding-top:24px}.stage{aspect-ratio:16/13}.wheel-area{top:49%;width:min(48vw,430px);height:min(48vw,430px);max-height:80%}.song{bottom:24px}}
</style></head>
<body><main class="app">
<header><div><div class="brand">CHORD / GESTURE</div><div class="sub">손끝으로 고르는 나만의 코드 휠</div></div><div class="badge" id="camBadge">CAMERA OFF</div></header>
<section class="stage" id="stage">
<video id="video" playsinline muted></video><div class="shade"></div>
<div class="camera-hint" id="hint">카메라를 켜거나 휠을 터치해 코드를 선택하세요</div>
<div class="wheel-area" id="wheelArea"><svg id="wheel" viewBox="0 0 400 400" aria-label="코드 선택 휠"></svg></div>
<div class="song"><small>NOW PLAYING</small><span id="songTitle">choose your chord</span></div>
</section>
<div class="controls"><button class="primary" id="cameraBtn">카메라 켜기</button><button id="playBtn">선택 코드 재생</button><button id="stopBtn">카메라 끄기</button></div>
<div class="panel"><div class="info"><div class="kicker">SELECTED CHORD</div><div class="value" id="chordName">C</div><div class="notes" id="chordNotes">C · E · G</div></div><div class="info"><div class="kicker">HAND POSITION</div><div class="value" id="handState">대기 중</div><div class="notes" id="handHelp">검지 끝을 휠 위로 이동</div></div></div>
<div class="options"><label for="sound">SOUND</label><select id="sound"><option value="soft">Soft keys</option><option value="pluck">Pluck</option><option value="organ">Organ</option></select><label for="vol">VOLUME</label><input id="vol" type="range" min="0" max="100" value="45"></div>
<p class="help">휠의 코드 이름을 누르면 바로 선택할 수 있어요. 카메라를 켜면 검지 손끝의 위치로 휠을 조작합니다. 검지 손끝을 가운데에서 바깥쪽으로 움직여 원하는 코드 방향에 놓아보세요. 코드는 선택할 때마다 소리로 확인할 수 있습니다.</p>
</main>
<script type="module">
import {FilesetResolver,HandLandmarker} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";
const $=id=>document.getElementById(id),svg=$("wheel"),video=$("video");
const data=[
{name:"C",notes:"C · E · G",midi:[60,64,67]},
{name:"Cadd9",notes:"C · D · E · G",midi:[60,62,64,67]},
{name:"B7",notes:"B · D♯ · F♯ · A",midi:[59,63,66,69]},
{name:"Bm",notes:"B · D · F♯",midi:[59,62,66]},
{name:"Em",notes:"E · G · B",midi:[64,67,71]},
{name:"G",notes:"G · B · D",midi:[55,59,62]},
{name:"D",notes:"D · F♯ · A",midi:[62,66,69]},
{name:"Am",notes:"A · C · E",midi:[57,60,64]}
];
let selected=0,ac=null,stream=null,tracker=null,lastChange=0,lastFrame=0;
const cx=200,cy=200,r=178,inner=42,step=Math.PI*2/data.length;
function polar(rad,a){return [cx+rad*Math.cos(a),cy+rad*Math.sin(a)]}
function sectorPath(a0,a1){const p1=polar(r,a0),p2=polar(r,a1),q1=polar(inner,a1),q2=polar(inner,a0);return `M${p1} A${r},${r} 0 0 1 ${p2} L${q1} A${inner},${inner} 0 0 0 ${q2} Z`}
function buildWheel(){svg.innerHTML="";data.forEach((d,i)=>{const a0=-Math.PI/2+i*step-step/2,a1=a0+step,mid=(a0+a1)/2;const path=document.createElementNS("http://www.w3.org/2000/svg","path");path.setAttribute("d",sectorPath(a0,a1));path.setAttribute("class","segment"+(i===selected?" active":""));path.addEventListener("click",()=>choose(i,true));svg.append(path);const [x,y]=polar(125,mid);const t=document.createElementNS("http://www.w3.org/2000/svg","text");t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("class","chord-label"+(i===selected?" active":""));t.textContent=d.name;t.addEventListener("click",()=>choose(i,true));svg.append(t);});const c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("cx",cx);c.setAttribute("cy",cy);c.setAttribute("r",inner-4);c.setAttribute("class","center");c.addEventListener("click",()=>play());svg.append(c);const ct=document.createElementNS("http://www.w3.org/2000/svg","text");ct.setAttribute("x",cx);ct.setAttribute("y",cy);ct.setAttribute("class","center-text");ct.textContent="PLAY";ct.addEventListener("click",play);svg.append(ct)}
function choose(i,sound=false){selected=(i+data.length)%data.length;const d=data[selected];$("chordName").textContent=d.name;$("chordNotes").textContent=d.notes;$("songTitle").textContent=d.name;buildWheel();if(sound)play();$("handState").textContent="선택됨";$("handHelp").textContent="검지 위치로 코드 선택"}
function context(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();return ac}
function play(){const c=context(),now=c.currentTime,amp=Number($("vol").value)/100*.1,kind=$("sound").value;data[selected].midi.forEach((m,j)=>{const o=c.createOscillator(),g=c.createGain();o.type=kind==="organ"?"sine":kind==="pluck"?"triangle":"sine";o.frequency.value=440*2**((m-69)/12);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(Math.max(.001,amp),now+.03);g.gain.exponentialRampToValueAtTime(.0001,now+(kind==="pluck"?.65:1.15));o.connect(g);g.connect(c.destination);o.start(now+j*.008);o.stop(now+1.2)})}
function angleIndex(x,y){let a=Math.atan2(y-cy,x-cx)+Math.PI/2;if(a<0)a+=Math.PI*2;return Math.floor((a+step/2)/step)%data.length}
async function startCamera(){try{$("cameraBtn").disabled=true;$("hint").textContent="손 인식 기능을 불러오는 중…";const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");tracker=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:"GPU"},runningMode:"VIDEO",numHands:1});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:800}},audio:false});video.srcObject=stream;await video.play();video.style.display="block";$("camBadge").textContent="CAMERA ON";$("hint").textContent="검지 손끝을 휠 위로 움직여 코드 선택";requestAnimationFrame(loop)}catch(e){$("cameraBtn").disabled=false;$("hint").textContent="카메라를 시작하지 못했어요. HTTPS와 카메라 권한을 확인하세요.";}}
function loop(t){if(!stream)return;if(video.readyState>=2&&t-lastFrame>50){lastFrame=t;const out=tracker.detectForVideo(video,t);if(out.landmarks?.length){const p=out.landmarks[0][8];const stage=$("stage").getBoundingClientRect(),wheel=$("wheelArea").getBoundingClientRect();const px=(1-p.x)*video.videoWidth,py=p.y*video.videoHeight;const sx=stage.width*(1-p.x),sy=stage.height*p.y;const localX=(sx-(wheel.left-stage.left))/wheel.width*400,localY=(sy-(wheel.top-stage.top))/wheel.height*400;const dist=Math.hypot(localX-cx,localY-cy);if(dist>50&&dist<210){const idx=angleIndex(localX,localY);$("handState").textContent="코드 "+data[idx].name;if(idx!==selected&&Date.now()-lastChange>450){lastChange=Date.now();choose(idx,true)}}}else{$("handState").textContent="손을 찾는 중"}}requestAnimationFrame(loop)}
function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;video.style.display="none";$("camBadge").textContent="CAMERA OFF";$("cameraBtn").disabled=false;$("hint").textContent="카메라를 켜거나 휠을 터치해 코드를 선택하세요";$("handState").textContent="대기 중"}
$("cameraBtn").addEventListener("click",startCamera);$("stopBtn").addEventListener("click",stop);$("playBtn").addEventListener("click",play);buildWheel();choose(0,false);window.addEventListener("pagehide",stop);
</script></body></html>
